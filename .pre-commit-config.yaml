# Quality and safety gate run before every commit (public showcase repository).
# Setup once: uv tool install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Secrets (API keys, tokens, connection strings) in staged changes
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Personal data, Azure IDs, private files, English-only, ADR structure, noreply identity
      - id: public-content
        name: public content check
        entry: scripts/hooks/check_public_content.sh
        language: script
        types: [text]

      # Canonical Terraform formatting
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -diff -recursive infra/terraform
        language: system
        files: \.tf$
        pass_filenames: false

      # Commit message rules (length, English, no AI attribution)
      - id: commit-msg
        name: commit message check
        entry: scripts/hooks/check_commit_msg.sh
        language: script
        stages: [commit-msg]
